<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gas Particle Simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap');

  :root {
    --bg: #f0f4f8;
    --panel: #ffffff;
    --border: #d0dce8;
    --accent: #5b8dee;
    --accent2: #f4845f;
    --accent3: #52c77a;
    --text: #2d3e50;
    --muted: #8fa3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    background: var(--panel);
  }

  header h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .main {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    width: 100%;
    max-width: var(--w);
    padding: 16px 12px 32px;
    gap: 0;
  }

  /* Left column: sim + plot stacked */
  .left-col {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  /* Fixed-size simulation canvas */
  canvas#sim {
    display: block;
    width: 500px;
    height: 400px;
    border: 1px solid var(--border);
    background: #fff;
  }

  /* PLOT */
  .plot-wrap {
    width: 500px;
    border: 1px solid var(--border);
    border-top: none;
    background: var(--panel);
    padding: 10px 14px 6px;
  }

  .plot-label {
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .info-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: default;
    opacity: 0.6;
    transition: opacity 0.15s;
  }

  .info-icon:hover { opacity: 1; }

  .info-icon .tooltip {
    display: none;
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 210px;
    background: var(--text);
    color: #fff;
    font-size: 0.55rem;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.03em;
    line-height: 1.6;
    padding: 8px 10px;
    border-radius: 4px;
    z-index: 10;
    pointer-events: none;
    text-transform: none;
    font-weight: 400;
  }

  .info-icon .tooltip::before {
    content: '';
    position: absolute;
    right: 100%;
    top: 50%;
    transform: translateY(-50%);
    border: 5px solid transparent;
    border-right-color: var(--text);
  }

  .info-icon:hover .tooltip {
    display: block;
  }

  canvas#plot {
    display: block;
    width: 100%;
    height: 160px;
  }

  .plot-legend {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    padding: 5px 0 2px 0;
    flex-wrap: wrap;
  }

  .plot-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.58rem;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
  }

  /* CONTROLS PANEL */
  .controls {
    width: 360px;
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: none;
    padding: 16px 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 20px;
    align-content: start;
  }

  @media (max-width: 880px) {
    .main {
      flex-direction: column;
      align-items: center;
    }
    canvas#sim { width: 100%; height: auto; }
    .plot-wrap { width: 100%; }
    .controls {
      width: 100%;
      border-left: 1px solid var(--border);
      border-top: none;
    }
  }

  .controls .full-width {
    grid-column: 1 / -1;
  }

  .ctrl-group label {
    display: block;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .ctrl-group .val-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3px;
  }

  .ctrl-group .val-row span {
    font-size: 0.72rem;
    color: var(--accent);
  }

  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .mode-btns {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .mode-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.06em;
    padding: 7px 9px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .mode-btn:hover { border-color: var(--accent); color: var(--text); }
  .mode-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(91,141,238,0.10);
  }

  .ctrl-section-header {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 5px;
    margin-bottom: 10px;
  }

  .action-btns {
    display: flex;
    flex-direction: row;
    gap: 8px;
    justify-content: center;
  }

  .action-btns .btn {
    flex: 1;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px;
    cursor: pointer;
    border: 1px solid;
    transition: all 0.15s;
    font-weight: 700;
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { opacity: 0.85; }

  .btn-secondary {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }

  .stats {
    font-size: 0.58rem;
    line-height: 1.9;
    color: var(--muted);
  }
  .stats b { color: var(--text); }

  .divider {
    height: 1px;
    background: var(--border);
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

<header>
  <h1>Particle gas simulation</h1>
</header>

<div class="main">

  <div class="left-col">
    <canvas id="sim"></canvas>

    <div class="plot-wrap">
      <div class="plot-label">
        Velocity Distribution
        <span class="info-icon">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="6.5" cy="6.5" r="6" stroke="#8fa3b8" stroke-width="1"/>
            <circle cx="6.5" cy="4" r="0.9" fill="#8fa3b8"/>
            <line x1="6.5" y1="6" x2="6.5" y2="9.5" stroke="#8fa3b8" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span class="tooltip">This histogram shows the number of particles that carry a determined velocity. The Maxwell-Boltzmann distribution that fits best the data is also plotted.</span>
        </span>
      </div>
      <canvas id="plot"></canvas>
      <div class="plot-legend">
        <div class="plot-legend-item">
          <svg width="18" height="10" style="flex-shrink:0"><line x1="0" y1="5" x2="18" y2="5" stroke="#5b8dee" stroke-width="2"/></svg>
          MB distr.
        </div>
        <div class="plot-legend-item">
          <svg width="18" height="10" style="flex-shrink:0"><line x1="0" y1="5" x2="18" y2="5" stroke="#f4845f" stroke-width="2" stroke-dasharray="4,3"/></svg>
          <span id="legend-mean">average —</span>
        </div>
        <div class="plot-legend-item">
          <svg width="18" height="10" style="flex-shrink:0"><line x1="0" y1="5" x2="18" y2="5" stroke="#52c77a" stroke-width="2" stroke-dasharray="4,3"/></svg>
          <span id="legend-rms">rms —</span>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">

    <!-- Left column: parameters -->
    <div>
      <div class="ctrl-section-header">Parameters</div>
      <div class="ctrl-group" style="margin-bottom:14px">
        <label>Particles</label>
        <div class="val-row"><span id="nVal">80</span></div>
        <input type="range" id="nSlider" min="0" max="1000" value="380">
      </div>
      <div class="ctrl-group" style="margin-bottom:14px">
        <label>Radius (px)</label>
        <div class="val-row"><span id="rVal">6</span></div>
        <input type="range" id="rSlider" min="1" max="50" value="6">
      </div>
      <div class="ctrl-group">
        <label>Temperature</label>
        <div class="val-row"><span id="sVal">1.0</span></div>
        <input type="range" id="sSlider" min="0" max="30" value="10">
      </div>
    </div>

    <!-- Right column: initial conditions -->
    <div>
      <div class="ctrl-section-header">Initial conditions</div>
      <div class="mode-btns">
        <button class="mode-btn active" data-mode="maxwell" onclick="setMode(this)">Random velocities</button>
        <button class="mode-btn" data-mode="single" onclick="setMode(this)">Single particle<br><span style="color:var(--muted);font-size:0.55rem">One moving, rest at rest</span></button>
        <button class="mode-btn" data-mode="uniform" onclick="setMode(this)">Uniform velocity<br><span style="color:var(--muted);font-size:0.55rem">All same speed &amp; direction</span></button>
      </div>
    </div>

    <!-- Action buttons spanning both columns -->
    <div class="action-btns full-width">
      <button class="btn btn-primary" onclick="restart()">↺ Restart</button>
      <button class="btn btn-secondary" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
    </div>

    <div class="divider"></div>

    <div class="stats full-width" id="stats">
      Number of collisions: <b>—</b><br>
    </div>

</div>

</div>

<script>
// ─── GLOBALS ───────────────────────────────────────────────────────────────
const simCanvas = document.getElementById('sim');
const plotCanvas = document.getElementById('plot');
const sctx = simCanvas.getContext('2d');
const pctx = plotCanvas.getContext('2d');

// Box logical size (3D cube)
const BOX = 500;

let particles = [];
let paused = false;
let animId = null;
let collisionCount = 0;
let mode = 'maxwell';

// Controls
const nSlider = document.getElementById('nSlider');
const sSlider = document.getElementById('sSlider');

// Logarithmic slider: maps [0,1000] → [5, 10000]
function sliderToN(v) {
  return Math.round(Math.exp(Math.log(5) + (v / 1000) * Math.log(10000 / 5)));
}

// Temperature slider: [0,30] → temperature [0.0, 3.0]
// Temperature = rms speed = sigma * sqrt(3), where sigma is per-component std dev
// So sigma = temperature / sqrt(3)
function sliderToTemp(v) {
  return v / 10;
}

nSlider.oninput = () => {
  document.getElementById('nVal').textContent = sliderToN(parseInt(nSlider.value));
};
sSlider.oninput = () => {
  document.getElementById('sVal').textContent = sliderToTemp(sSlider.value).toFixed(1);
};

const rSlider = document.getElementById('rSlider');
rSlider.oninput = () => document.getElementById('rVal').textContent = rSlider.value;

function setMode(el) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  mode = el.dataset.mode;
}

function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ Resume' : '⏸ Pause';
  if (!paused) loop();
}

// ─── CANVAS SETUP ──────────────────────────────────────────────────────────
function setupCanvases() {
  const dpr = window.devicePixelRatio || 1;

  // Sim canvas: CSS size fixed at 500×400
  const simCSSW = 500, simCSSH = 400;
  simCanvas.width  = simCSSW * dpr;
  simCanvas.height = simCSSH * dpr;
  simCanvas.style.width  = simCSSW + 'px';
  simCanvas.style.height = simCSSH + 'px';
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Plot canvas: CSS width from layout, height 160px
  const plotCSSW = plotCanvas.offsetWidth || 472;
  const plotCSSH = 160;
  plotCanvas.width  = plotCSSW * dpr;
  plotCanvas.height = plotCSSH * dpr;
  plotCanvas.style.width  = plotCSSW + 'px';
  plotCanvas.style.height = plotCSSH + 'px';
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', () => {
  const dpr = window.devicePixelRatio || 1;
  const plotCSSW = plotCanvas.offsetWidth || 472;
  plotCanvas.width  = plotCSSW * dpr;
  plotCanvas.height = 160 * dpr;
  plotCanvas.style.width  = plotCSSW + 'px';
  plotCanvas.style.height = '160px';
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
});

// ─── PARTICLE CREATION ─────────────────────────────────────────────────────
function gaussRand() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function createParticles(n, radius, temperature) {
  const ps = [];
  const maxAttempts = 2000;
  // temperature = rms speed = sigma * sqrt(3), so sigma = temperature / sqrt(3)
  const sigma = temperature > 0 ? temperature / Math.sqrt(3) : 0.001;

  for (let i = 0; i < n; i++) {
    let x, y, z, attempts = 0, ok = false;
    while (attempts++ < maxAttempts) {
      x = radius + Math.random() * (BOX - 2 * radius);
      y = radius + Math.random() * (BOX - 2 * radius);
      z = radius + Math.random() * (BOX - 2 * radius);
      ok = true;
      for (const p of ps) {
        const dx = p.x - x, dy = p.y - y, dz = p.z - z;
        if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 2 * radius + 1) { ok = false; break; }
      }
      if (ok) break;
    }

    let vx = 0, vy = 0, vz = 0;
    if (mode === 'maxwell') {
      // 3D MB: each component ~ N(0, sigma²); will rescale after all particles are drawn
      vx = gaussRand();
      vy = gaussRand();
      vz = gaussRand();
    } else if (mode === 'single') {
      // Only particle 0 moves. v_rms = sqrt(v0²/n) = temperature → |v0| = temperature*sqrt(n)
      if (i === 0) {
        const spd = temperature * Math.sqrt(n);
        // Direction: normalise (1, 0.3, 0.2) for a visually interesting angle
        const len = Math.sqrt(1 + 0.09 + 0.04);
        vx = spd * 1 / len;
        vy = spd * 0.3 / len;
        vz = spd * 0.2 / len;
      }
    } else if (mode === 'uniform') {
      // All particles same velocity. v_rms = |v| = temperature → |v| = temperature
      // Direction: normalise (4, 1, 1)
      const len = Math.sqrt(16 + 1 + 1);
      vx = temperature * 4 / len;
      vy = temperature * 1 / len;
      vz = temperature * 1 / len;
    }

    ps.push({ x, y, z, vx, vy, vz, radius, id: i });
  }

  // For maxwell mode: rescale all velocities so the actual sample rms equals temperature exactly.
  // The raw draws have rms = sqrt(3) on average but fluctuate; rescaling fixes it precisely.
  if (mode === 'maxwell' && temperature > 0) {
    const sampleRms = Math.sqrt(ps.reduce((acc, p) => acc + p.vx*p.vx + p.vy*p.vy + p.vz*p.vz, 0) / ps.length);
    if (sampleRms > 0) {
      const scale = temperature / sampleRms;
      for (const p of ps) { p.vx *= scale; p.vy *= scale; p.vz *= scale; }
    }
  }

  return ps;
}

// ─── PHYSICS ───────────────────────────────────────────────────────────────
function step(dt) {
  dt = Math.min(dt, 0.032);

  // Move
  for (const p of particles) {
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.z += p.vz * dt * 60;
  }

  // Wall collisions (cube)
  for (const p of particles) {
    if (p.x - p.radius < 0)   { p.x = p.radius;        p.vx =  Math.abs(p.vx); }
    if (p.x + p.radius > BOX) { p.x = BOX - p.radius;  p.vx = -Math.abs(p.vx); }
    if (p.y - p.radius < 0)   { p.y = p.radius;        p.vy =  Math.abs(p.vy); }
    if (p.y + p.radius > BOX) { p.y = BOX - p.radius;  p.vy = -Math.abs(p.vy); }
    if (p.z - p.radius < 0)   { p.z = p.radius;        p.vz =  Math.abs(p.vz); }
    if (p.z + p.radius > BOX) { p.z = BOX - p.radius;  p.vz = -Math.abs(p.vz); }
  }

  // Particle-particle elastic collisions via spatial grid (O(N) average)
  // Cell size = 2*radius so only 3x3x3 = 27 neighbouring cells need checking.
  const radius   = particles.length > 0 ? particles[0].radius : 6;
  const cellSize = 2 * radius;
  const nCells   = Math.ceil(BOX / cellSize);

  // Build grid: sparse map from cell key to array of particle indices
  const grid = new Map();
  for (let i = 0; i < particles.length; i++) {
    const p   = particles[i];
    const cx  = Math.floor(p.x / cellSize);
    const cy  = Math.floor(p.y / cellSize);
    const cz  = Math.floor(p.z / cellSize);
    const key = cx + cy * nCells + cz * nCells * nCells;
    let cell  = grid.get(key);
    if (!cell) { cell = []; grid.set(key, cell); }
    cell.push(i);
  }

  // For each particle, check only the 27 cells in its 3x3x3 neighbourhood
  for (let i = 0; i < particles.length; i++) {
    const a  = particles[i];
    const cx = Math.floor(a.x / cellSize);
    const cy = Math.floor(a.y / cellSize);
    const cz = Math.floor(a.z / cellSize);

    for (let ddz = -1; ddz <= 1; ddz++) {
      for (let ddy = -1; ddy <= 1; ddy++) {
        for (let ddx = -1; ddx <= 1; ddx++) {
          const nx2 = cx + ddx, ny2 = cy + ddy, nz2 = cz + ddz;
          if (nx2 < 0 || ny2 < 0 || nz2 < 0 || nx2 >= nCells || ny2 >= nCells || nz2 >= nCells) continue;
          const key  = nx2 + ny2 * nCells + nz2 * nCells * nCells;
          const cell = grid.get(key);
          if (!cell) continue;

          for (let k = 0; k < cell.length; k++) {
            const j = cell[k];
            if (j <= i) continue; // each pair once only

            const b       = particles[j];
            const dx      = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
            const dist2   = dx*dx + dy*dy + dz*dz;
            const minDist = a.radius + b.radius;

            if (dist2 < minDist * minDist && dist2 > 0) {
              const dist    = Math.sqrt(dist2);
              const overlap = (minDist - dist) / 2;
              const nx = dx/dist, ny = dy/dist, nz = dz/dist;

              // Separate
              a.x -= nx * overlap; a.y -= ny * overlap; a.z -= nz * overlap;
              b.x += nx * overlap; b.y += ny * overlap; b.z += nz * overlap;

              // Impulse (equal mass elastic)
              const dvx = a.vx - b.vx, dvy = a.vy - b.vy, dvz = a.vz - b.vz;
              const dot = dvx*nx + dvy*ny + dvz*nz;
              if (dot > 0) {
                a.vx -= dot*nx; a.vy -= dot*ny; a.vz -= dot*nz;
                b.vx += dot*nx; b.vy += dot*ny; b.vz += dot*nz;
                collisionCount++;
              }
            }
          }
        }
      }
    }
  }
}

// ─── ORTHOGRAPHIC PROJECTION ───────────────────────────────────────────────
// Simple oblique/isometric-style: yaw + pitch rotation, no perspective divide.

const YAW   = Math.PI / 6;
const PITCH = Math.PI / 10;
const SCALE = 0.72; // shrink the box to fit nicely in 500×400

function project(x, y, z) {
  const cx = x - BOX/2, cy = y - BOX/2, cz = z - BOX/2;

  // Yaw (around Y)
  const x1 =  cx * Math.cos(YAW) + cz * Math.sin(YAW);
  const y1 =  cy;
  const z1 = -cx * Math.sin(YAW) + cz * Math.cos(YAW);

  // Pitch (around X)
  const x2 = x1;
  const y2 = y1 * Math.cos(PITCH) - z1 * Math.sin(PITCH);
  const z2 = y1 * Math.sin(PITCH) + z1 * Math.cos(PITCH);

  // Orthographic: just translate to canvas centre, no divide
  const sx = 250 + x2 * SCALE;
  const sy = 200 + y2 * SCALE;

  return { sx, sy, depth: z2 };
}

// ─── DRAW WIREFRAME BOX ────────────────────────────────────────────────────
function drawBox() {
  const corners = [
    [0,0,0],[BOX,0,0],[BOX,BOX,0],[0,BOX,0],
    [0,0,BOX],[BOX,0,BOX],[BOX,BOX,BOX],[0,BOX,BOX]
  ].map(([x,y,z]) => project(x,y,z));

  const edges = [
    [0,1],[1,2],[2,3],[3,0], // back face
    [4,5],[5,6],[6,7],[7,4], // front face
    [0,4],[1,5],[2,6],[3,7]  // connecting edges
  ];

  sctx.strokeStyle = 'rgba(91,141,238,0.18)';
  sctx.lineWidth = 1;
  for (const [a,b] of edges) {
    sctx.beginPath();
    sctx.moveTo(corners[a].sx, corners[a].sy);
    sctx.lineTo(corners[b].sx, corners[b].sy);
    sctx.stroke();
  }
}

// ─── RENDER SIM ────────────────────────────────────────────────────────────
// Shared colour reference updated by renderPlot each frame so both views
// use exactly the same axisMax and HSL parameters.
let sharedAxisMax = 1;

function renderSim() {
  const W = 500, H = 400;   // CSS pixels — context is already scaled by DPR
  sctx.fillStyle = '#ffffff';
  sctx.fillRect(0, 0, W, H);

  drawBox();

  // Project all particles and sort back-to-front (painter's algorithm)
  const projected = particles.map(p => {
    const spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy + p.vz*p.vz);
    // Same mapping as histogram bars: t = speed / axisMax, capped at 1
    const t = Math.min(spd / sharedAxisMax, 1);
    const { sx, sy, depth } = project(p.x, p.y, p.z);
    const screenR = Math.max(1, p.radius * SCALE);
    return { p, sx, sy, screenR, depth, t, spd };
  });
  projected.sort((a, b) => a.depth - b.depth);

  for (const { p, sx, sy, screenR, t, spd } of projected) {
    // Exact same hue formula as histogram: hue = (1 - t) * 240
    const hue = Math.round((1 - t) * 240);

    // Velocity trail
    if (spd > 0.3) {
      const len = Math.min(spd * 1.2, 18);
      const inv = 1 / spd;
      const tx = p.x - p.vx * inv * len;
      const ty = p.y - p.vy * inv * len;
      const tz = p.z - p.vz * inv * len;
      const tail = project(tx, ty, tz);
      sctx.beginPath();
      sctx.moveTo(sx, sy);
      sctx.lineTo(tail.sx, tail.sy);
      // Same saturation/lightness as histogram bars, slightly transparent
      sctx.strokeStyle = `hsla(${hue},70%,55%,0.25)`;
      sctx.lineWidth = screenR * 0.7;
      sctx.stroke();
    }

    // Sphere disc — rim colour matches histogram exactly (70%, 55%),
    // highlight is the same hue lightened for the 3D shading effect
    const grd = sctx.createRadialGradient(
      sx - screenR * 0.3, sy - screenR * 0.3, 0,
      sx, sy, screenR
    );
    grd.addColorStop(0, `hsla(${hue},70%,80%,1)`);
    grd.addColorStop(1, `hsla(${hue},70%,55%,1)`);
    sctx.beginPath();
    sctx.arc(sx, sy, screenR, 0, Math.PI * 2);
    sctx.fillStyle = grd;
    sctx.fill();
  }
}

// ─── VELOCITY DISTRIBUTION PLOT ────────────────────────────────────────────
let plotTick = 0;
let stableYMax = 0;  // persistent Y-axis ceiling, updated with hysteresis

function renderPlot() {
  plotTick++;
  if (plotTick % 6 !== 0) return;

  // Always work in CSS pixels — the context transform handles DPR scaling
  const W = plotCanvas.offsetWidth || 472;
  const H = 160;
  pctx.clearRect(0, 0, W, H);

  const speeds = particles.map(p => Math.sqrt(p.vx*p.vx + p.vy*p.vy + p.vz*p.vz));
  if (speeds.length === 0) return;

  // Margins: left for Y-axis labels, bottom for X-axis labels, top/right padding
  const ML = 36, MB = 32, MT = 8, MR = 8;
  const PW = W - ML - MR;  // plot width
  const PH = H - MT - MB;  // plot height

  // Compute rms
  const rms = Math.sqrt(speeds.reduce((a, s) => a + s*s, 0) / speeds.length);
  const avgSpd = speeds.reduce((a, b) => a + b, 0) / speeds.length;

  // X-axis max = 3*rms, extended if any speed exceeds it
  const currentMax = speeds.reduce((a, b) => Math.max(a, b), 0);
  let axisMax = 3 * rms;
  if (currentMax > axisMax) axisMax = currentMax;
  if (axisMax === 0) axisMax = 1;
  sharedAxisMax = axisMax;  // share with renderSim for consistent colour mapping

  // Histogram
  const bins = 30;
  const hist = new Array(bins).fill(0);
  for (const s of speeds) {
    const bi = Math.min(Math.floor(s / axisMax * bins), bins - 1);
    hist[bi]++;
  }
  const rawYMax = Math.max(...hist) || 1;

  // Stable Y axis: update only when peak exceeds ceiling or drops below 80% of it.
  // New ceiling = ceil(1.25 * current peak), giving headroom above the tallest bar.
  if (stableYMax === 0 || rawYMax > stableYMax || rawYMax < 0.8 * stableYMax) {
    stableYMax = Math.ceil(rawYMax * 1.25);
  }
  const axisYMax = stableYMax;

  // ── Draw axes ──
  pctx.strokeStyle = '#8fa3b8';
  pctx.lineWidth = 1;
  pctx.beginPath();
  // Y axis
  pctx.moveTo(ML, MT); pctx.lineTo(ML, MT + PH);
  // X axis
  pctx.lineTo(ML + PW, MT + PH);
  pctx.stroke();

  const FONT = '9px Space Mono, monospace';
  pctx.font = FONT;
  pctx.fillStyle = '#8fa3b8';
  pctx.textBaseline = 'middle';

  // ── Y ticks: 0, 25%, 50%, 75%, 100% of axisYMax ──
  const yTickCount = 4;
  for (let i = 0; i <= yTickCount; i++) {
    const val = Math.round(axisYMax * i / yTickCount);
    const yy  = MT + PH - (i / yTickCount) * PH;
    // tick
    pctx.beginPath();
    pctx.moveTo(ML - 3, yy); pctx.lineTo(ML, yy);
    pctx.strokeStyle = '#8fa3b8'; pctx.lineWidth = 1;
    pctx.stroke();
    // grid line (subtle)
    if (i > 0) {
      pctx.beginPath();
      pctx.strokeStyle = 'rgba(143,163,184,0.18)';
      pctx.moveTo(ML, yy); pctx.lineTo(ML + PW, yy);
      pctx.stroke();
    }
    // label
    pctx.textAlign = 'right';
    pctx.fillText(val, ML - 5, yy);
  }

  // ── X ticks: 5 evenly spaced ──
  const xTickCount = 5;
  for (let i = 0; i <= xTickCount; i++) {
    const val = axisMax * i / xTickCount;
    const xx  = ML + (i / xTickCount) * PW;
    pctx.beginPath();
    pctx.strokeStyle = '#8fa3b8'; pctx.lineWidth = 1;
    pctx.moveTo(xx, MT + PH); pctx.lineTo(xx, MT + PH + 3);
    pctx.stroke();
    if (i > 0) {
      pctx.beginPath();
      pctx.strokeStyle = 'rgba(143,163,184,0.18)';
      pctx.moveTo(xx, MT); pctx.lineTo(xx, MT + PH);
      pctx.stroke();
    }
    pctx.textAlign = 'center';
    pctx.textBaseline = 'top';
    pctx.fillStyle = '#8fa3b8';
    pctx.fillText(val.toFixed(val < 1 ? 2 : 1), xx, MT + PH + 5);
  }

  // ── Axis labels ──
  // X label
  pctx.textAlign = 'center';
  pctx.textBaseline = 'bottom';
  pctx.fillStyle = '#2d3e50';
  pctx.font = '9px Space Mono, monospace';
  pctx.fillText('Velocity', ML + PW / 2, H);

  // Y label (rotated)
  pctx.save();
  pctx.translate(0, MT + PH / 2);
  pctx.rotate(-Math.PI / 2);
  pctx.textAlign = 'center';
  pctx.textBaseline = 'top';
  pctx.fillText('Particles', 0, 1);
  pctx.restore();

  // ── Bars ──
  const bw = PW / bins;
  for (let i = 0; i < bins; i++) {
    const bh = (hist[i] / axisYMax) * PH;
    const t  = i / (bins - 1);
    const hue = Math.round((1 - t) * 240);
    pctx.fillStyle = `hsla(${hue},70%,55%,0.75)`;
    pctx.fillRect(ML + i * bw + 1, MT + PH - bh, bw - 2, bh);
  }

  // ── MB curve ──
  const sigma = rms / Math.sqrt(3);
  const norm  = particles.length * (axisMax / bins);
  pctx.beginPath();
  pctx.strokeStyle = '#5b8dee';
  pctx.lineWidth = 1.5;
  for (let px = 0; px <= PW; px++) {
    const v  = (px / PW) * axisMax;
    const fv = norm * Math.sqrt(2 / Math.PI) * (v * v / (sigma * sigma * sigma))
               * Math.exp(-v * v / (2 * sigma * sigma));
    const yy = MT + PH - (fv / axisYMax) * PH;
    px === 0 ? pctx.moveTo(ML + px, yy) : pctx.lineTo(ML + px, yy);
  }
  pctx.stroke();

  // ── RMS vertical line ──
  const rmsX = ML + (rms / axisMax) * PW;
  pctx.beginPath();
  pctx.strokeStyle = '#52c77a';
  pctx.lineWidth = 1.5;
  pctx.setLineDash([4, 3]);
  pctx.moveTo(rmsX, MT); pctx.lineTo(rmsX, MT + PH);
  pctx.stroke();
  pctx.setLineDash([]);

  // ── Mean vertical line ──
  const meanX = ML + (avgSpd / axisMax) * PW;
  pctx.beginPath();
  pctx.strokeStyle = '#f4845f';
  pctx.lineWidth = 1.5;
  pctx.setLineDash([4, 3]);
  pctx.moveTo(meanX, MT); pctx.lineTo(meanX, MT + PH);
  pctx.stroke();
  pctx.setLineDash([]);

  // ── Update HTML legend ──
  document.getElementById('legend-mean').textContent = `mean ${avgSpd.toFixed(2)}`;
  document.getElementById('legend-rms').textContent  = `rms ${rms.toFixed(2)}`;
}

// ─── STATS ─────────────────────────────────────────────────────────────────
let statTick = 0;
function updateStats() {
  statTick++;
  if (statTick % 20 !== 0) return;
  document.getElementById('stats').innerHTML =
    `Number of collisions: <b>${collisionCount}</b>`;
}

// ─── LOOP ──────────────────────────────────────────────────────────────────
let lastTime = null;
function loop(ts) {
  if (paused) return;
  if (lastTime === null) lastTime = ts;
  const dt = (ts - lastTime) / 1000;
  lastTime = ts;
  step(dt);
  renderSim();
  renderPlot();
  updateStats();
  animId = requestAnimationFrame(loop);
}

// ─── RESTART ───────────────────────────────────────────────────────────────
function restart() {
  if (animId) cancelAnimationFrame(animId);
  paused = false;
  document.getElementById('pauseBtn').textContent = '⏸ Pause';
  setupCanvases();
  collisionCount = 0;
  stableYMax = 0;
  lastTime = null;

  const n    = sliderToN(parseInt(nSlider.value));
  const r    = parseInt(rSlider.value);
  const temp = sliderToTemp(parseInt(sSlider.value));
  particles = createParticles(n, r, temp);

  animId = requestAnimationFrame(loop);
}

// ─── INIT ──────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  setupCanvases();
  restart();
});
</script>
</body>
